name: Release launcher

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    name: Package and publish launcher
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Package release
        run: |
          mkdir release
          cp README.md LICENSE livesplit-proton-launcher.sh setup-desktop-entry.sh release/
          chmod +x release/livesplit-proton-launcher.sh release/setup-desktop-entry.sh
          cd release
          zip -9 "../LiveSplit-Proton-${GITHUB_REF_NAME}.zip" \
            README.md LICENSE livesplit-proton-launcher.sh setup-desktop-entry.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "LiveSplit-Proton-${GITHUB_REF_NAME}.zip" \
            --title "LiveSplit-Proton $GITHUB_REF_NAME" \
            --generate-notes
